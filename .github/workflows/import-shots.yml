name: Import Direction B shots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-shots.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download screenshots
        run: |
          set -eux
          curl -fsSL -o b-login.png https://litter.catbox.moe/geioi9.png
          curl -fsSL -o b-create.png https://litter.catbox.moe/fu7zzc.png
          curl -fsSL -o b-board.png https://litter.catbox.moe/w1r3b6.png
          curl -fsSL -o b-create-filled.png https://litter.catbox.moe/i0a05f.png
          file b-login.png b-create.png b-board.png b-create-filled.png
      - name: Commit via Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          put() {
            local path="$1"
            local content
            content="$(base64 -w0 "$path")"
            local sha
            sha="$(gh api "repos/${{ github.repository }}/contents/${path}" --jq .sha || true)"
            if [ -n "${sha}" ] && [ "${sha}" != "null" ]; then
              gh api --method PUT "repos/${{ github.repository }}/contents/${path}" \
                -f message="Add ${path}" -f content="${content}" -f sha="${sha}"
            else
              gh api --method PUT "repos/${{ github.repository }}/contents/${path}" \
                -f message="Add ${path}" -f content="${content}"
            fi
          }
          put b-login.png
          put b-create.png
          put b-board.png
          put b-create-filled.png
