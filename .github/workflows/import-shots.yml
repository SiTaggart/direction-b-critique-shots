name: Import Direction B shots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-shots.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots
        run: |
          set -eux
          curl -fsSL -o b-login.png https://litter.catbox.moe/geioi9.png
          curl -fsSL -o b-create.png https://litter.catbox.moe/fu7zzc.png
          curl -fsSL -o b-board.png https://litter.catbox.moe/w1r3b6.png
          curl -fsSL -o b-create-filled.png https://litter.catbox.moe/i0a05f.png
          file b-login.png b-create.png b-board.png b-create-filled.png
      - name: Commit via Contents API JSON body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          python3 <<'PY'
          import base64, json, pathlib, subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]
          for path in ["b-login.png", "b-create.png", "b-board.png", "b-create-filled.png"]:
              content = base64.b64encode(pathlib.Path(path).read_bytes()).decode()
              sha = None
              probe = subprocess.run(["gh", "api", f"repos/{repo}/contents/{path}", "--jq", ".sha"], capture_output=True, text=True)
              if probe.returncode == 0:
                  sha = probe.stdout.strip() or None
              payload = {"message": f"Add {path}", "content": content}
              if sha:
                  payload["sha"] = sha
              pathlib.Path("payload.json").write_text(json.dumps(payload))
              subprocess.check_call(["gh", "api", "--method", "PUT", f"repos/{repo}/contents/{path}", "--input", "payload.json"])
              print("uploaded", path, "bytes", pathlib.Path(path).stat().st_size)
          PY
